name: Nextflow Stub Runs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  stub-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['24.10.5', '25.10.4', '26.04.0']
        config: [
          'test-diann.config',
          'test-cascadia.config',
          'test-encyclopedia-narrow-gpf.config',
          'test-encyclopedia-wide-only.config',
          'test-diann-pdc.config',
          'test-carafe-multi.config',
          'test-carafe-dzip.config',
          'test-diann-ddir.config',
          'test-carafe-pdc.config',
          'test-skip-dia-search.config',
          'test-msconvert-only-pdc.config',
          'test-msconvert-only-local.config',
          'test-diann-multi-batch-metadata.config',
          'test-diann-minimize.config',
          'test-diann-panorama-upload.config',
          'test-diann-pdc-upload.config',
          'test-diann-pdc-batches.config',
          'test-diann-pdc-batches-messy.config',
          'test-diann-batch-multidir.config',
          'test-sampled-dup-names.config',
          'test-batch-name-whitespace.config',
          'test-diann-filename-glob.config'
        ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Run (nf ${{ matrix.nextflow-version }} / ${{ matrix.config }})
      env:
        NXF_VER: ${{ matrix.nextflow-version }}
      run: |
        echo "Installing Nextflow ${NXF_VER}:"
        curl -s https://get.nextflow.io | bash
        chmod +x nextflow
        echo "Running Nextflow stub with config: ${{ matrix.config }}"
        ./nextflow run . -stub-run -c test-resources/${{ matrix.config }} -c test-resources/ci.config

  # Negative tests: configs that must fail fast with a clear, parameter-attributed error
  # message (see modules/utils.nf resolve_user_path / list_user_dir). Each entry asserts the
  # run exits non-zero AND that the expected message fragment appears in the output.
  negative-stub-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['24.10.5', '25.10.4', '26.04.0']
        # NOTE: `case` is a real matrix axis, not `include:`. Two `include:` entries that both
        # set `config` overwrite each other instead of adding a case, which would silently drop
        # coverage as cases are added.
        case:
          - config: 'test-bad-chromatogram-dir.config'
            expect: 'Parameter `chromatogram_library_spectra_dir` resolved to the filesystem root'
          - config: 'test-batch-name-invalid.config'
            expect: 'Parameter `quant_spectra_dir` contains an invalid batch name'
          - config: 'test-batch-duplicate-files.config'
            expect: 'Parameter `quant_spectra_dir` resolved multiple spectra files with the same name'
          - config: 'test-pdc-batch-file-short-row.config'
            expect: 'Parameter `pdc.batch_file`: line 3 of'
          - config: 'test-pdc-batch-file-empty.config'
            expect: 'Parameter `pdc.batch_file` is set but empty'
          - config: 'test-batch-name-duplicate.config'
            expect: 'Parameter `quant_spectra_dir` contains the batch name'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Expect failure (nf ${{ matrix.nextflow-version }} / ${{ matrix.case.config }})
      env:
        NXF_VER: ${{ matrix.nextflow-version }}
        CONFIG: ${{ matrix.case.config }}
        # Passed via env (not inlined into the script) so backticks in the fragment are
        # treated as literal text rather than shell command substitution.
        EXPECT: ${{ matrix.case.expect }}
      run: |
        echo "Installing Nextflow ${NXF_VER}:"
        curl -s https://get.nextflow.io | bash
        chmod +x nextflow
        echo "Running negative stub with config: ${CONFIG} (expecting failure)"
        set +e
        output=$(./nextflow run . -stub-run -c "test-resources/${CONFIG}" -c test-resources/ci.config 2>&1)
        status=$?
        set -e
        echo "$output"
        if [ "$status" -eq 0 ]; then
          echo "::error::Expected a non-zero exit but the run succeeded."
          exit 1
        fi
        if ! echo "$output" | grep -qF "$EXPECT"; then
          echo "::error::Did not find expected message fragment: $EXPECT"
          exit 1
        fi
        echo "Negative test passed: failed as expected with the attributed error message."
